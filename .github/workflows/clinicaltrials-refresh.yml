name: ClinicalTrials Refresh

# Runs run_pipeline.py --refresh automatically on weekday mornings and
# on demand (Actions tab -> "Run workflow"). Every step after the
# local-time gate only proceeds if the pre-refresh test suite passes,
# the ct.gov fetch + validation succeeds, and pipeline_viz.py rebuilds
# cleanly — trials.csv and the dashboard outputs are only committed
# after ALL of that succeeds. See run_pipeline.py's own docstring for
# the underlying fetch/validate/rebuild safety contract; this workflow
# adds nothing to that contract beyond scheduling + the commit/push.
#
# Does NOT implement competitive-change detection — automatic
# ingestion + safe rebuild only, per project scope.

on:
  schedule:
    # GitHub Actions cron always runs in UTC and does NOT shift for
    # daylight saving time, so "6:30 AM America/Los_Angeles" maps to
    # two different UTC times across the year:
    #   - PDT (UTC-7, roughly mid-Mar to early-Nov): 13:30 UTC
    #   - PST (UTC-8, roughly early-Nov to mid-Mar):  14:30 UTC
    # Both crons fire every weekday; the "Check target local time"
    # step below figures out which one is DST-correct today and
    # skips the rest of the job on the other, so only one of them
    # ever does real work on any given day.
    - cron: "30 13 * * 1-5" # ~6:30 AM PDT
    - cron: "30 14 * * 1-5" # ~6:30 AM PST
  workflow_dispatch: {}

# Prevents two refreshes from running (and both trying to commit)
# at the same time. A run triggered while one is already in progress
# waits its turn rather than being dropped, but cancel-in-progress
# stays false so a fetch/validate/commit already underway is never
# torn down mid-way.
concurrency:
  group: clinicaltrials-refresh
  cancel-in-progress: false

# Needed so the final step can push the commit back to the repo using
# the repo's own built-in GITHUB_TOKEN — no personal access token or
# secret setup required.
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check target local time (America/Los_Angeles)
        id: tzcheck
        run: |
          # NOTE: this used to compare the wall-clock hour AT RUN TIME
          # against "06" — but GitHub Actions scheduled triggers are
          # frequently delayed (routinely by 30-90+ minutes under
          # queue load), so by the time this step actually ran, the
          # local hour was reliably past 06 and this gate skipped
          # EVERY scheduled run, silently, for as long as this
          # workflow existed (verified via the Actions run history:
          # 18/18 scheduled runs skipped past this step). Comparing
          # against github.event.schedule instead is immune to that
          # delay, since GitHub fixes that value to the cron
          # expression that triggered the run at DISPATCH time, not
          # whenever the runner happens to pick the job up.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manually triggered — running regardless of schedule."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            TZ_ABBR=$(TZ='America/Los_Angeles' date +%Z)
            if [ "$TZ_ABBR" = "PDT" ]; then
              EXPECTED_CRON="30 13 * * 1-5"
            else
              EXPECTED_CRON="30 14 * * 1-5"
            fi
            echo "Currently $TZ_ABBR; DST-correct cron: '$EXPECTED_CRON'; this run's cron: '${{ github.event.schedule }}'"
            if [ "${{ github.event.schedule }}" = "$EXPECTED_CRON" ]; then
              echo "This is the DST-correct scheduled trigger — proceeding."
              echo "proceed=true" >> "$GITHUB_OUTPUT"
            else
              echo "Not the DST-correct scheduled trigger — skipping the rest of this run."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Checkout repository
        if: steps.tzcheck.outputs.proceed == 'true'
        uses: actions/checkout@v6

      - name: Set up Python
        if: steps.tzcheck.outputs.proceed == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        if: steps.tzcheck.outputs.proceed == 'true'
        run: pip install -r requirements.txt

      - name: Run full test suite (pre-refresh baseline check)
        if: steps.tzcheck.outputs.proceed == 'true'
        # Deliberately NOT `for f in test_*.py` -- this repo also carries
        # the separate ADNI Natural History dashboard's test suite
        # (test_adni_*.py), which checks the checked-in
        # biomarker_dashboard.html against adni_viz.py's current source
        # and can fail on its own staleness with zero connection to the
        # ClinicalTrials.gov pipeline this workflow refreshes -- exactly
        # what happened on 2026-08-21 (the DST gate finally let a real
        # run through, only for it to be blocked here by an unrelated
        # ADNI test failure, silently skipping the refresh). Importing
        # run_pipeline.TEST_FILES (the same scoped list its own STEP
        # 8/8 post-refresh validation already uses) instead of
        # hardcoding a second copy of that list here means this gate
        # can never drift out of sync with it again.
        run: |
          python3 -c "
          import subprocess, sys
          import run_pipeline
          failed = False
          for f in run_pipeline.TEST_FILES:
              print(f'=== {f} ===')
              if subprocess.run([sys.executable, f]).returncode != 0:
                  failed = True
          sys.exit(1 if failed else 0)
          "

      - name: Refresh ClinicalTrials.gov data and rebuild dashboard
        if: steps.tzcheck.outputs.proceed == 'true'
        run: python3 run_pipeline.py --refresh

      - name: Commit and push validated outputs
        if: steps.tzcheck.outputs.proceed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trials.csv pipeline_annotated.csv pipeline_drugs.csv \
                  pipeline_interventions.csv pipeline_unresolved_trials.csv \
                  pipeline_overview.html outputs/classification_conflicts.csv \
                  outputs/classification_gap_audit.csv outputs/pipeline_changes.csv
          if git diff --staged --quiet; then
            echo "No changes to commit — ClinicalTrials.gov data was already up to date."
          else
            git commit -m "Automated ClinicalTrials.gov refresh ($(TZ='America/Los_Angeles' date +%Y-%m-%d))"
            git push
          fi

      # data/raw/ (raw API JSON) and data/snapshots/ (dated,
      # validated snapshot CSVs) are both .gitignore'd (see the
      # previous phase's git-hygiene decision: ~40MB and ~15MB per
      # fetch respectively — committing those daily would balloon
      # the repo). They still exist on this runner's disk for the
      # duration of the job for debugging via the step logs above,
      # but are discarded when the runner is torn down.
